<div class="login-container">

    <div class="login-card">

        <h2>Online Exam Management System</h2>

        <h3>Login</h3>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                [(ngModel)]="email">   <!--Two-Way Binding-->

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                [(ngModel)]="password">

        </div>

        <button
            (click)="onLogin()">

            Login

        </button>

    </div>

</div>
